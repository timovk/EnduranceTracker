# Builds the thing the user actually asked for: a Windows installer they can
# double-click.
#
# This is the only place a Windows binary is ever produced. The development
# container has no Windows and no Wine, so nobody gets to iterate on this job
# interactively — it has to be right rather than tuned. Everything it does is
# either in package.json or in electron-builder.yml, so a developer on a
# Windows machine running `npm run dist:win` gets exactly what CI gets.

name: Windows desktop build

on:
  # A build on demand, from any branch, for testing an installer before a release.
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: desktop-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installer:
    name: Installer (x64)
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      # Only ever written to attach the installers to a tagged release. There
      # is no update server and nothing is published anywhere else.
      contents: write

    env:
      # `.env` is deliberately not in the repository, and both `prisma generate`
      # and `next build` want a datasource URL. This one is a scratch database
      # in the workspace, thrown away with the runner; it is not packaged, and
      # the installed application creates its own under %APPDATA% on first run.
      DATABASE_URL: file:./endurance.db

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `next build` renders pages, and a page that reaches for the database
      # during the build needs one with the schema applied. Cheap, and it makes
      # the build independent of whatever happens to be in the workspace.
      - name: Apply migrations to the build-time database
        run: npm run db:deploy

      # One script rather than six steps, because the ORDER is the whole point
      # and it must not be possible for CI and a developer's machine to drift
      # apart. `dist:win` is:
      #
      #   db:generate → desktop:rebuild → desktop:build → desktop:prepare → electron-builder
      #
      # The rebuild has to happen BEFORE `next build`: `next build` copies
      # whatever better_sqlite3.node is on disk into .next/standalone, so a
      # rebuild afterwards would leave the shipped server holding a binary
      # compiled for plain Node that Electron cannot load. electron-builder is
      # configured with npmRebuild: false for the same reason.
      - name: Build the installer
        run: npm run dist:win

      - name: List what was produced
        shell: bash
        run: ls -lh dist/*.exe

      - name: Upload the installers
        uses: actions/upload-artifact@v4
        with:
          name: endurance-racing-career-windows-x64
          path: dist/*.exe
          # A green job with no installer in it is worse than a red one.
          if-no-files-found: error
          retention-days: 30

      - name: Attach the installers to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # `gh` ships on the runner, so there is no third-party action in the
          # release path.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --notes "Windows build of Endurance Racing Career $TAG."
          fi
          gh release upload "$TAG" dist/*.exe --clobber
