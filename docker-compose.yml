# A PostgreSQL server for local development.
#
# The application needs a database and nothing else. If you already run
# PostgreSQL, ignore this file and point DATABASE_URL at your own server.
#
#   docker compose up -d
#
# then use this in .env:
#
#   DATABASE_URL="postgresql://endurance:endurance@localhost:5432/endurance?schema=public"

services:
  db:
    image: postgres:16-alpine
    container_name: endurance-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: endurance
      POSTGRES_PASSWORD: endurance
      POSTGRES_DB: endurance
    ports:
      - "5432:5432"
    volumes:
      # Named volume, so your viewing history survives `docker compose down`.
      # Use `docker compose down -v` only if you genuinely want to erase it.
      - endurance-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U endurance -d endurance"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  endurance-data:
